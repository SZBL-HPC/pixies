[workspace]
authors = ["HU Xuesong <87519979+huxs001@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
name = "gromacs"
platforms = ["osx-arm64", { name = "gpu-linux-64", platform = "linux-64", cuda = "12.4", glibc = "2.17" }, { name = "centos75", platform = "linux-64", glibc = "2.17", linux = "3.10" }, "linux-64"]
version = "0.1.0"

[tasks._d_plumed]
description = "Download the PLUMED 2.10.1 source archive."
cmd = """
    mkdir -p pkg \
    && curl -L -C - -o pkg/plumed-src-2.10.1.tgz \
        https://github.com/plumed/plumed2/releases/download/v2.10.1/plumed-src-2.10.1.tgz
"""
outputs = ["pkg/plumed-src-2.10.1.tgz"]

[tasks._d_gromacs]
description = "Download a GROMACS source archive."
args = [{ arg = "version", default = "2023.5", choices = ["2023.5", "2024.6", "2025.5", "2026.3"] }]
cmd = """
    mkdir -p pkg \
    && curl -L -C - -o pkg/gromacs-{{ version }}.tar.gz \
        https://ftp.gromacs.org/gromacs/gromacs-{{ version }}.tar.gz
"""
outputs = ["pkg/gromacs-{{ version }}.tar.gz"]

[tasks._mk_plumed]
description = "Build and install PLUMED for the active Pixi environment."
args = [{ arg = "pixi_env", default = "default" }]
depends-on = ["_d_plumed"]
cmd = """
    plumed_dir="plumed-2.10.1/{{ pixi.environment.name }}" \
    && plumed_prefix="$PIXI_PROJECT_ROOT/local/plumed/{{ pixi.environment.name }}" \
    && rm -rf "$plumed_dir" \
    && mkdir -p "$plumed_dir" \
    && tar -xf pkg/plumed-src-2.10.1.tgz \
        --strip-components=1 \
        --exclude='plumed-2.10.1/src/include/plumed' \
        -C "$plumed_dir" \
    && cd "$plumed_dir" \
    && bash "$PIXI_PROJECT_ROOT/scripts/build-plumed.sh" \
        "$plumed_prefix" "{{ pixi.environment.name }}" "$PWD" \
    && rm -rf src/include/plumed
"""
outputs = [
    "local/plumed/{{ pixi.environment.name }}/bin/plumed",
    "local/plumed/{{ pixi.environment.name }}/bin/plumed-config",
    "local/plumed/{{ pixi.environment.name }}/bin/plumed-patch",
]

[tasks.plumed-benchmark]
description = "Run a small PLUMED benchmark for the active Pixi environment."
depends-on = [
    { task = "_mk_plumed", args = ["{{ pixi.environment.name }}"] },
]
cmd = """
    plumed_bin="$PIXI_PROJECT_ROOT/local/plumed/{{ pixi.environment.name }}/bin/plumed" \
    && benchmark_dir="$PIXI_PROJECT_ROOT/.pixi/plumed-benchmark/{{ pixi.environment.name }}" \
    && mkdir -p "$benchmark_dir" \
    && printf '%s\\n' \
        'd1: DISTANCE ATOMS=1,2' \
        'd2: DISTANCE ATOMS=2,3' \
        'PRINT ARG=d1,d2 FILE=COLVAR' \
        > "$benchmark_dir/plumed.dat" \
    && cd "$benchmark_dir" \
    && "$plumed_bin" benchmark \
        --plumed plumed.dat \
        --natoms 10 \
        --nsteps 100
"""

[tasks.plumed-mdrun-test]
description = "Run a minimal GROMACS mdrun with PLUMED for the active environment."
args = [{ arg = "version", default = "2023.5", choices = ["2023.5", "2024.6", "2025.5", "2026.3"] }]
depends-on = [
    { task = "build", args = ["{{ version }}"] },
]
cmd = "bash scripts/plumed-mdrun-test.sh {{ version }} {{ pixi.environment.name }}"

[tasks.plumed-hrex-test]
description = "Run a minimal PLUMED Hamiltonian replica-exchange test."
args = [{ arg = "version", default = "2023.5", choices = ["2023.5", "2024.6", "2025.5", "2026.3"] }]
depends-on = [
    { task = "build", args = ["{{ version }}"] },
]
cmd = "bash scripts/plumed-hrex-test.sh {{ version }} {{ pixi.environment.name }}"

[tasks._p_gromacs]
description = "Patch GROMACS with the PLUMED build for the active Pixi environment."
args = [{ arg = "version", default = "2023.5", choices = ["2023.5", "2024.6", "2025.5", "2026.3"] }]
depends-on = [
    { task = "_d_gromacs", args = ["{{ version }}"] },
    { task = "_mk_plumed", args = ["{{ pixi.environment.name }}"] },
] # 必须确保 plumed 先编译完成并生成了 patch 工具
cmd = """
    gromacs_dir="gromacs-{{ version }}/{{ pixi.environment.name }}" \
    && plumed_prefix="$PIXI_PROJECT_ROOT/local/plumed/{{ pixi.environment.name }}" \
    && ( test -f "$gromacs_dir/src/gromacs/mdrun/runner.cpp.preplumed" || ( \
        test -d "$gromacs_dir" || ( \
            mkdir -p "$gromacs_dir" \
            && tar -xf pkg/gromacs-{{ version }}.tar.gz --strip-components=1 -C "$gromacs_dir" \
        ) \
        && cd "$gromacs_dir" \
        && "$plumed_prefix/bin/plumed-patch" -e gromacs-{{ version }} -p \
    ) ) \
    && sh "$PIXI_PROJECT_ROOT/patches/apply_patches.sh" \
        "$PIXI_PROJECT_ROOT/patches/gromacs_{{ version }}" \
        "$gromacs_dir"
"""
outputs = [
    "gromacs-{{ version }}/{{ pixi.environment.name }}/src/gromacs/mdrun/runner.cpp.preplumed",
]

[tasks._mk_gromacs]
description = "Configure, build, and install one GROMACS variant."
args = [
    { arg = "version", default = "2023.5", choices = ["2023.5", "2024.6", "2025.5", "2026.3"] },
    { arg = "variant", default = "single", choices = ["single", "double", "ocl"] },
    { arg = "suffix", default = "" },
]
depends-on = [
    { task = "_p_gromacs", args = ["{{ version }}"] },
    { task = "_mk_plumed", args = ["{{ pixi.environment.name }}"] },
]
cmd = """
    gromacs_dir="gromacs-{{ version }}/{{ pixi.environment.name }}" \
    && mkdir -p "$PIXI_PROJECT_ROOT/local/gromacs/{{ version }}" \
    && mkdir -p "$gromacs_dir/build_{{ variant }}" \
    && cd "$gromacs_dir/build_{{ variant }}" \
    && cmake --fresh .. \
        $DGROMACS_Common \
        {% if pixi.environment.name == "default" %} \
        -DGMX_MPI=OFF \
        {% else %} \
        -DGMX_MPI=ON \
        {% endif %} \
        $DGROMACS_GPU_Toolchain \
        {% if pixi.environment.name == "default" or pixi.environment.name == "mpis" or variant == "double" or variant == "ocl" %} \
        -DGMXAPI=OFF \
        {% endif %} \
        {% if variant == "double" %} \
        -DGMX_GPU=OFF -DGMX_DOUBLE=ON \
        {% elif variant == "ocl" %} \
        -DGMX_GPU=OpenCL \
        {% else %} \
        $DGROMACS_GPU \
        {% endif %} \
        -DGMX_BINARY_SUFFIX={{ suffix }} \
        -DGMX_LIBS_SUFFIX={{ suffix }} \
        -DCMAKE_INSTALL_PREFIX="$PIXI_PROJECT_ROOT/local/gromacs/{{ version }}" \
    && make \
    && make install
"""
outputs = [
    # Outputs are templated before activation.env is available; mirror the suffix mapping here.
    "local/gromacs/{{ version }}/bin/gmx{{ suffix }}",
    "gromacs-{{ version }}/{{ pixi.environment.name }}/build_{{ variant }}/bin/gmx{{ suffix }}",
]

[tasks._batch_mk_gromacs]
description = "Build the single- and double-precision GROMACS variants."
args = [
    { arg = "version", default = "2023.5", choices = ["2023.5", "2024.6", "2025.5", "2026.3"] },
    { arg = "suffix", default = "" },
]
depends-on = [
    { task = "_mk_gromacs", args = ["{{ version }}", "single", "{{ suffix }}"] },
    { task = "_mk_gromacs", args = ["{{ version }}", "double", "{{ suffix }}_d"] },
]

[target.linux-64.tasks._batch_mk_gromacs]
description = "Build the single-, double-, and OpenCL GROMACS variants on Linux."
args = [
    { arg = "version", default = "2023.5", choices = ["2023.5", "2024.6", "2025.5", "2026.3"] },
    { arg = "suffix", default = "" },
]
depends-on = [
    { task = "_mk_gromacs", args = ["{{ version }}", "single", "{{ suffix }}"] },
    { task = "_mk_gromacs", args = ["{{ version }}", "double", "{{ suffix }}_d"] },
    { task = "_mk_gromacs", args = ["{{ version }}", "ocl", "{{ suffix }}_ocl"] },
]

[tasks.down]
description = "Download the PLUMED and GROMACS source archives."
args = [{ arg = "version", default = "2023.5", choices = ["2023.5", "2024.6", "2025.5", "2026.3"] }]
depends-on = [
    "_d_plumed",
    { task = "_d_gromacs", args = ["{{ version }}"] },
]

[tasks.build]
description = "Build PLUMED and the GROMACS variants for the active environment."
args = [{ arg = "version", default = "2023.5", choices = ["2023.5", "2024.6", "2025.5", "2026.3"] }]
depends-on = [
    { task = "_mk_plumed", args = ["{{ pixi.environment.name }}"] },
    { task = "_batch_mk_gromacs", args = [
        "{{ version }}",
        """{%- if pixi.environment.name == "default" -%}
{%- elif pixi.environment.name == "mpis" and pixi.is_osx -%}
_ompi
{%- elif pixi.environment.name == "mpi5" or pixi.environment.name == "mpis" -%}
_mpi
{%- endif -%}""",
    ] },
]

[dependencies]
compilers = ">=1.10.0,<3"
_openmp_mutex = ">=4.5,<5"
cmake = ">=3.18.4,<4"
make = ">=4.4.1,<5"
patch = ">=2.8,<3"
pip = ">=26.2.1,<27"
setuptools = ">=84.0.0,<85"
cython = ">=3.3.0,<4"
pkg-config = ">=0.29.2,<0.30"
fftw = ">=3.3,<4"
libhwloc = ">=2.12.2,<3"
pocl = ">=7.1,<8"
gsl = ">=2.8,<3"
zlib = ">=1.3,<2"

[target.linux-64.dependencies]
cuda-compiler = ">=12.4,<14"
cuda-libraries = ">=12.4,<14"
cuda-libraries-dev = ">=12.4,<14"
cuda-nvml-dev = ">=12.4,<14"
ocl-icd = ">=2.3.4,<3"

[target.osx-arm64.dependencies]
khronos-opencl-icd-loader = ">=2024.10.24,<2025"
ocl_icd_wrapper_apple = ">=1.0.0,<2"

[feature.mpi.dependencies]
fftw = { build = "mpi_*" }

[feature.mpi.target.linux-64.dependencies]
openmpi = ">=5.0.8,<6"

[feature.mpi.target.osx-arm64.dependencies]
mpich = ">=5.0.0,<6"

[feature.mpi-slurm]
channels = ["conda-forge/label/mpi-external"]
dependencies = { fftw = { build = "mpi_*" }, openmpi = ">=5.0.8,<6" }

[feature.mpi-slurm.target.linux-64.dependencies]
openmpi = { build = "external_*" }

[environments]
mpi5 = ["mpi"]
mpis = ["mpi-slurm"]

# Activation inheritance order:
# default feature -> target -> feature target -> environment override.
[activation]
env = {
    PATH = "$PIXI_PROJECT_ROOT/local/bin:$PATH",
    DGROMACS_Common = "-DGMX_DEFAULT_SUFFIX=OFF -DGMX_USE_PLUMED=ON -DGMX_THREAD_MPI=OFF -DGMX_HWLOC=ON",
    CXXFLAGS = "-Wno-missing-include-dirs -Wno-deprecated-literal-operator -Wno-deprecated-declarations -Wno-switch-default"
}
scripts = ["local/bin/GMXRC.bash"]

[target.osx-arm64.activation.env]
MAKEFLAGS = "-j4"
DGROMACS_GPU = "-DGMX_GPU=OpenCL -DGMX_DOUBLE=OFF"
DGROMACS_GPU_Toolchain = """ \
-DOpenCL_INCLUDE_DIR=$CONDA_PREFIX/include \
-DOpenCL_LIBRARY=$CONDA_PREFIX/lib/libOpenCL.dylib \
"""
FI_PROVIDER = "tcp"
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"
PLUMEDCONF = "--disable-python --disable-pycv"

[target.linux-64.activation.env]
MAKEFLAGS = "-j8"
DGROMACS_GPU = "-DGMX_GPU=CUDA"
DGROMACS_GPU_Toolchain = """ \
-DCMAKE_INSTALL_LIBDIR=lib \
-DCUDA_NVCC_EXECUTABLE=$CONDA_PREFIX/bin/nvcc \
-DCMAKE_CUDA_COMPILER=$CONDA_PREFIX/bin/nvcc \
"""
PLUMEDCONF = ""

[feature.mpi-slurm.target.linux-64.activation]
scripts = ["activate_mpi.sh"]

[feature.mpi-slurm.target.linux-64.activation.env]
CPPFLAGS="-I$CONDA_PREFIX/include"
LDFLAGS="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -Wl,-rpath-link,$CONDA_PREFIX/lib"
USE_SLURM = "1"
GMX_FORCE_GPU_AWARE_MPI = "1"
