[workspace]
authors = ["HU Xuesong <87519979+huxs001@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
name = "percolator"
platforms = ["osx-arm64", { platform = "linux-64", glibc = "2.17" }]
version = "0.1.0"

[tasks._percolator]
cmd = "mkdir -p pkg && test -e pkg/percolator/.git/config || git clone --depth=1 https://github.com/percolator/percolator.git pkg/percolator"

[tasks._build2]
cmd = "tools/build2-toolchain"

[tasks._xsd]
cmd = "mkdir -p pkg && test -e pkg/xsd/.git/config || git clone --depth=1 --branch master --single-branch https://git.codesynthesis.com/xsd/xsd.git pkg/xsd"

[tasks.clone]
depends-on = ["_build2", "_percolator", "_xsd"]

[tasks.clean]
cmd = "rm -rf build pkg/xsd/.bdep"

[tasks.build]
cmd = "tools/build"
depends-on = ["clone"]

[dependencies]
boost-cpp = ">=1.85.0,<2"
cxx-compiler = ">=2.0.0,<3"
gawk = ">=5.4.1,<6"
python = ">=3.14.7,<3.15"
cmake = ">=3.15,<=4.4.2"
eigen = "==3.4.0"
libtirpc = ">=1.3,<2"
xerces-c = ">=3.2,<4"
zlib = ">=1.3.2,<2"

[activation.env]
PATH = "$PIXI_PROJECT_ROOT/tools/bin:$PATH"
