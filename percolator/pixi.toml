[workspace]
authors = ["HU Xuesong <87519979+huxs001@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
name = "percolator"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
clone = "git clone --depth=1 https://github.com/percolator/percolator.git"
build = "./build.sh"

[dependencies]
boost-cpp = ">=1.85.0,<2"
cxx-compiler = ">=2.0.0,<3"
gawk = ">=5.4.1,<6"
python = ">=3.14.7,<3.15"
cmake = ">=3.10,<=4.4.2"
